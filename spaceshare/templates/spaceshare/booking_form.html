<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request a seat | SpaceShare</title>
</head>
<body>
    <main>
        <h1>Request a seat</h1>
        <h2>{{ listing.title }}</h2>
        <p>{{ listing.general_area }}</p>
        <p>{{ listing.date }} | {{ listing.start_time }} - {{ listing.end_time }}</p>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {{ form.as_p }}
            <button type="submit">Send request</button>
        </form>
    </main>
</body>
</html>
