# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at the repo. Render reads this file
# and provisions both the web service and the database in one step.
#
# After the first deploy, go to the web service's Environment tab and set
# CORS_ALLOWED_ORIGINS to your deployed frontend's URL (Render can't know
# that ahead of time since it depends on where you deploy the React app).

databases:
  - name: spaceshare-db
    plan: free

services:
  - type: web
    name: spaceshare-api
    runtime: python
    plan: free
    buildCommand: "pip install -e . && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn spaceshare_project.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: spaceshare-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: "https://replace-with-your-frontend.vercel.app"
      - key: DATABASE_URL
        fromDatabase:
          name: spaceshare-db
          property: connectionString
