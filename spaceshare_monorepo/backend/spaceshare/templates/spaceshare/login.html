<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in to SpaceShare</title>
</head>
<body>
    <main>
        <h1>Log in to SpaceShare</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {{ form.as_p }}
            <button type="submit">Log in</button>
        </form>
        <a href="{% url 'register' %}">Create an account</a>
    </main>
</body>
</html>
