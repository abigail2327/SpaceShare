[project]
name = "spaceshare"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zainab", email = "zainabshah2003@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.4",
    "dj-database-url>=2.2",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.7",
    "gunicorn>=23.0",
]

[project.scripts]
spaceshare = "spaceshare:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
